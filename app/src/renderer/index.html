<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https: http:; font-src 'self' data:; media-src 'self' https: http:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>SimpleMD</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="motion.css" />
  </head>
  <body>
    <button id="chrome-reveal" type="button" aria-label="Show window controls"></button>
    <header class="titlebar">
      <div class="tb-side"></div>
      <div class="tb-title">SimpleMD</div>
      <div class="tb-side tb-right"></div>
    </header>

    <div id="findbar" hidden>
      <input id="find-input" type="search" placeholder="Find in note" aria-label="Find in note" spellcheck="false" />
      <output id="find-count" role="status" aria-live="polite">0 of 0</output>
      <button id="find-previous" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)">↑</button>
      <button id="find-next" type="button" aria-label="Next match" title="Next match (Enter)">↓</button>
      <button id="find-close" type="button" aria-label="Close Find">×</button>
    </div>

    <div id="workspace">
      <div id="tabs" role="tablist" aria-label="Documents" hidden></div>
      <div id="sidebar-divider" role="separator" aria-label="Tab sidebar width" aria-orientation="vertical" aria-controls="tabs" aria-valuemin="160" aria-valuemax="420" aria-valuenow="220" tabindex="0" hidden></div>
      <main id="stage" data-panes="0">
        <div id="welcome" class="empty-actions"><button id="welcome-open" type="button" class="pill">Open file</button><button id="welcome-new" type="button" class="pill">New tab</button></div>
      </main>
    </div>
    <template id="pane-template">
      <div class="document-pane">
        <div class="pane-toolbar">
          <div class="pane-name"><span id="name"></span><span id="dirty" title="Unsaved changes" role="status" hidden>Edited</span></div>
          <div class="pane-controls">
          <button id="nav-back" type="button" class="pill" title="Go back to the previous document" aria-label="Back" hidden>←</button>
          <details id="reader-options" class="reader-options" hidden>
            <summary title="Reading text size and Settings" aria-label="Reading options">Aa</summary>
            <div class="reader-options-menu">
              <div class="reader-size"><button id="reading-smaller" type="button" aria-label="Smaller reading text">A−</button><output id="reading-size"></output><button id="reading-larger" type="button" aria-label="Larger reading text">A+</button></div>
              <p id="reading-override" hidden>GitHub style fixes text at 16px. Use Zoom to enlarge it.</p>
              <button id="reader-settings" type="button">Settings…</button>
            </div>
          </details>
          <div id="modes" class="seg" role="radiogroup" aria-label="Document mode" hidden>
            <button type="button" role="radio" data-mode="read" aria-checked="true" title="Read without editing the text">Read</button>
            <button type="button" role="radio" data-mode="live" aria-checked="false" title="Edit with formatting shown around the cursor">Live</button>
            <button type="button" role="radio" data-mode="split" aria-checked="false" title="Edit the text beside a formatted page" aria-label="Side by side">Side</button>
            <button type="button" role="radio" data-mode="source" aria-checked="false" title="Edit the text with all Markdown symbols visible">Source</button>
          </div>
          <select class="mode-menu" aria-label="Document mode" title="Document mode" hidden>
            <option value="read" title="Read without editing the text">Read</option><option value="live" title="Edit with formatting shown around the cursor">Live</option><option value="split" title="Edit the text beside a formatted page">Side by side</option><option value="source" title="Edit the text with all Markdown symbols visible">Source</option>
          </select>
          <button id="edit-btn" type="button" class="pill" title="Edit document (⌘E)" hidden>Edit</button>
          </div>
        </div>
        <div id="banner" role="status" hidden></div>
        <div class="pane-content">
      <section id="read" class="pane">
        <div id="read-scroll" class="scroller">
          <article id="doc" class="prose" hidden></article>
          <div id="empty">
            <p class="hint-title">SimpleMD</p>
            <div class="empty-actions">
              <button id="open-file" type="button" class="pill">Open file</button>
              <button id="new-note" type="button" class="pill">New note</button>
            </div>
            <p class="faint">You can also drop a Markdown file here.</p>
          </div>
        </div>
      </section>

      <section id="edit" class="pane" hidden data-mode="live">
        <div id="editor-host"></div>
        <div id="preview-pane" hidden>
          <div id="preview-scroll" class="scroller"><article id="preview" class="prose"></article></div>
        </div>
      </section>
        </div>
        <footer class="pane-status"><span id="hint" hidden></span>
          <div class="drag-export-controls">
            <select id="export-format" aria-label="Export format"><option value="html">HTML</option><option value="pdf">PDF</option></select>
            <button id="drag-export" type="button" title="Save an exported file, or drag it out">Export</button>
          </div>
          <div id="changes" class="change-controls" hidden>
            <span id="change-count"></span>
            <button id="previous-change" type="button" title="Previous change" aria-label="Previous change">↑</button>
            <button id="next-change" type="button" title="Next change" aria-label="Next change">↓</button>
            <button id="mark-seen" type="button" title="Mark Seen (⌘⇧M)">Mark Seen</button>
          </div>
        </footer>
      </div>
    </template>


    <div id="picker" hidden>
      <div class="picker-card">
        <input
          id="picker-input"
          type="text"
          role="combobox"
          aria-expanded="true"
          aria-controls="picker-list"
          aria-autocomplete="list"
          aria-label="Command"
          spellcheck="false"
          autocomplete="off"
        />
        <ul id="picker-list" role="listbox"></ul>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
