[package]
name = "simplemd-helper"
version = "0.1.0"
edition = "2024"
description = "macOS save-metadata helper for SimpleMD"
license = "MIT"
publish = false
default-run = "simplemd-helper"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
