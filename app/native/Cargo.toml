[package]
name = "simplemd-helper"
version = "0.1.0"
edition = "2024"
description = "macOS save-metadata helper for SimpleMD"
license = "MIT"
publish = false
default-run = "simplemd-helper"

[features]
cli-test-hooks = []

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Memory", "Win32_System_IO"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
