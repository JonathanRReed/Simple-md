[package]
name = "simplemd-peek"
version = "0.1.0"
edition = "2024"
description = "Native helper that turns Space in the OS file manager into a SimpleMD preview request"
license = "MIT"
publish = false
default-run = "simplemd-peek"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
