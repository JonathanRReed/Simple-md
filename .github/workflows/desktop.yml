name: Desktop checks and unsigned artifacts

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outline-proof-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  desktop:
    name: macOS-arm64 DOM proof
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: outline-flake
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun run setup
      - name: Thirty consecutive DOM suite passes
        working-directory: app
        shell: bash
        run: |
          mkdir -p /tmp/dom-proof
          revision=$(git rev-parse HEAD)
          echo "$revision" | tee /tmp/dom-proof/HEAD.txt
          git diff --exit-code
          files=$(grep -l dom-runner test/*.test.ts)
          echo "$files" | tee /tmp/dom-proof/files.txt
          echo "::notice title=DOM proof head::$revision"
          for i in $(seq 1 30); do
            echo "DOM PROOF $i/30 HEAD $revision"
            if ! bun test $files > "/tmp/dom-proof/$i.log" 2>&1; then
              cat "/tmp/dom-proof/$i.log"
              exit 1
            fi
            tail -n 7 "/tmp/dom-proof/$i.log"
            echo "::notice title=DOM proof $i/30::$revision passed every DOM-runner test file"
          done
          echo "consecutive=30 head=$revision" | tee /tmp/dom-proof/receipt.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dom-proof
          path: /tmp/dom-proof/
