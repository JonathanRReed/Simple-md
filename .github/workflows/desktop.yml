name: Desktop checks and unsigned artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    name: Windows preview and installer
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Install locked dependencies
        run: bun run setup
      - name: Bundle shared static renderer
        working-directory: app
        run: bun run build/windows-preview.mjs
      - name: Differential static rendering and Jump List tests without Electron
        working-directory: app
        run: bun test test/windows-preview.test.ts test/native-recents.test.ts
      - name: Check preview formatting
        run: cargo fmt --manifest-path app/native/windows-preview/Cargo.toml --check
      - name: Lint preview
        run: cargo clippy --locked --manifest-path app/native/windows-preview/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Test bounds, inert content, hidden COM lifecycle and fallback
        run: cargo test --locked --manifest-path app/native/windows-preview/Cargo.toml -- --test-threads=1
      - name: Save hidden-window diagnostics before uninstall
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview-diagnostics -Force | Out-Null
          Copy-Item "$env:USERPROFILE/AppData/LocalLow/SimpleMD/Preview/*.log" preview-diagnostics/ -ErrorAction SilentlyContinue
      - name: Build preview DLL
        run: cargo build --locked --release --manifest-path app/native/windows-preview/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build NSIS installer
        run: bun run dist
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem app/native/windows-preview/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Check standalone and NSIS per-user install/uninstall
        shell: pwsh
        run: |
          $installer = (Get-ChildItem app/release/*.exe | Select-Object -First 1).FullName
          ./app/native/windows-preview/verify-install.ps1 -Installer $installer
      - name: Stage standalone handler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-preview | Out-Null
          Copy-Item app/native/windows-preview/target/x86_64-pc-windows-msvc/release/simplemd_windows_preview.dll windows-preview/
          Copy-Item app/native/windows-preview/install.ps1, app/native/windows-preview/uninstall.ps1, app/native/windows-preview/TESTING.md windows-preview/
          "Source commit: $env:GITHUB_SHA" | Set-Content windows-preview/REVISION.txt
      - name: Upload Windows preview and installer
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMD-Windows-M7
          if-no-files-found: error
          retention-days: 7
          path: |
            windows-preview/
            app/release/*.exe
      - name: Save installer hook diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview-diagnostics -Force | Out-Null
          Copy-Item "$env:TEMP/SimpleMD-preview-*.log" preview-diagnostics/ -ErrorAction SilentlyContinue
      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-preview-diagnostics
          if-no-files-found: ignore
          path: preview-diagnostics/

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
          - name: macOS-x64
            os: macos-15-intel
          - name: Windows-x64
            os: windows-2025
          - name: Linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install locked dependencies
        run: bun run setup
      - name: Typecheck
        run: bun run typecheck
      - name: Build simplemd-helper for save metadata
        if: runner.os == 'macOS'
        run: bun run build:native
      - name: Test
        if: runner.os != 'Linux'
        run: bun run test
      - name: Test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test
      - name: GitHub fidelity corpus
        if: runner.os != 'Linux'
        run: bun run test:corpus
      - name: GitHub fidelity corpus (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:corpus
      - name: Check Rust formatting
        run: cargo fmt --manifest-path app/native/Cargo.toml --check
      - name: Check Rust
        run: bun run check:rust
      - name: Test Rust
        run: bun run test:rust
      - name: Verify host and unsigned packaging plan
        run: bun run pack:plan
      - name: Build and package unsigned artifacts
        run: bun run dist
      # Hosted macOS does not provide a stable logged-in GUI session or owner-host
      # thresholds. Compile the same entrypoint and run its protocol/statistics tests.
      - name: Performance harness smoke signal (no absolute thresholds)
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: app
        run: |
          bun build bench.ts --target=bun --outdir=.perf-ci
          bun test test/performance.test.ts
      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMD-unsigned-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
