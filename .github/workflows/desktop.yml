name: Desktop checks and unsigned artifacts
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sidebar-probe-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  desktop:
    name: macOS-arm64 DOM diagnostics
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun run setup
      - name: Deterministic entry regression
        working-directory: app
        shell: bash
        run: |
          mkdir -p /tmp/entry-regression
          if ! bun test test/editor-restore-dom.test.ts > /tmp/entry-regression/result.log 2>&1; then
            cat /tmp/entry-regression/result.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-regression
          path: /tmp/entry-regression/
      - name: All DOM files diagnostic loop
        working-directory: app
        shell: bash
        run: |
          mkdir -p /tmp/dom-probes
          files=$(grep -l dom-runner test/*.test.ts)
          for i in $(seq 1 3); do
            if ! bun test $files > "/tmp/dom-probes/$i.log" 2>&1; then
              cat "/tmp/dom-probes/$i.log"
            fi
            tail -n 7 "/tmp/dom-probes/$i.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dom-probes
          path: /tmp/dom-probes/
